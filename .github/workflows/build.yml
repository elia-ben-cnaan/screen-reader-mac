name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      full:
        description: "Full e2e (all units x10 + all 300 SELF_REPORT). Default: small sample (~1/6 of the minutes)"
        type: boolean
        default: false
      e2e:
        description: "Run the end-to-end step (uses paid model calls). Untick to only check that the app builds"
        type: boolean
        default: true
permissions: { contents: write }
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env: { SR_SERVER: "${{ secrets.SR_SERVER }}", SR_TOKEN: "${{ secrets.SR_TOKEN }}" }
        run: ./build.sh && ditto -c -k --keepParent ScreenReader.app ScreenReader.zip
      - name: Layout self-test (no screen, no network)
        run: |
          for f in q-text q-shapes q-matrix; do
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --window-size=1000,1100 --screenshot="$PWD/$f.png" "file://$PWD/test/$f.html" 2>/dev/null || true
          done
          ls q-*.png && ScreenReader.app/Contents/MacOS/ScreenReader --layout q-*.png || echo "skipped"
      - name: End-to-end (OCR on Mac -> server -> answer)   # uses model quota: run manually (Actions -> build -> Run workflow)
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        timeout-minutes: 75
        env: { SR_SERVER: "${{ secrets.SR_SERVER }}", SR_TOKEN: "${{ secrets.SR_TOKEN }}" }
        run: |
          brew install tesseract tesseract-lang >/dev/null 2>&1 || true
          mkdir -p ~/.config/screenreader && printf '%s\n%s\n' "$SR_SERVER" "$SR_TOKEN" > ~/.config/screenreader/server
          for f in q-text q-shapes q-matrix; do
            echo "=== $f"; ScreenReader.app/Contents/MacOS/ScreenReader --explain $f.png || true
          done
          # full simulator run: instructions + 10 questions per unit, scored against the answer key
          if [ "${{ inputs.full }}" = "true" ]; then PU=10; SRN=0; else PU=3; SRN=30; fi
          (cd test/sim5 && PER_UNIT=$PU SR_LIMIT=$SRN python3 build.py)   # units 1-5: 10 each; unit 6: whole SELF_REPORT bank
          mkdir -p shots
          for u in 1 2 3 4 5 6 7; do last=$(python3 -c "import json;k=json.load(open('test/sim5/key.json'))[$u-1];print(len(k.get('answers') or k.get('items') or k.get('formats'))-1)"); for q in $(seq -1 $last); do
            n=$(printf "u%d_q%02d.png" $u $((q+1)))
            perl -e 'alarm 30; exec @ARGV' "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars --window-size=1000,900 --screenshot="$PWD/shots/$n" "file://$PWD/test/sim5/index.html?unit=$u&q=$q" 2>/dev/null
          done; done
          echo "screens: $(ls shots | wc -l)"
          ScreenReader.app/Contents/MacOS/ScreenReader --run-sim shots/*.png | tee sim-run.tsv | awk 'NR%25==0{print "progress", NR; fflush()}' || true
          cat sim-run.tsv; python3 test/sim5/score.py sim-run.tsv | tee sim-score.txt
          rm -f ~/.config/screenreader/server
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'   # branch test runs never replace the downloadable build
        with: { tag_name: latest, name: "ScreenReader (latest build)", files: ScreenReader.zip, make_latest: true }
