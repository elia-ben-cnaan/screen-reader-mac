const HE = ['א','ב','ג','ד'];
const p = new URLSearchParams(location.search);
let ui = Math.max(0, (+p.get('unit') || 1) - 1), qi = -2;   // -2 = start screen, -1 = unit instructions
const autoSec = +p.get('auto') || 0;
const $ = id => document.getElementById(id);
function render() {
  const u = U[ui];
  $('opts').innerHTML = '';
  if (qi === -2) {
    $('meta').textContent = '';
    $('stem').innerHTML = `<h1>ברוכים הבאים</h1><h2>המבדק כולל ${U.length} פרקים, ${U[0].qs.length} שאלות בכל פרק.</h2><div class=instr>לחצו "הבא" כדי להתחיל.</div>`;
  } else if (qi === -1) {
    $('meta').textContent = `פרק ${ui + 1} מתוך ${U.length}`;
    $('stem').innerHTML = `<h1>פרק ${ui + 1}: ${u.name}</h1><h2>הנחיות לפרק</h2><div class=instr>${u.instr}</div><div class=instr style="margin-top:18px;color:#556">בפרק ${u.qs.length} שאלות. לחצו "הבא" כדי להתחיל את הפרק.</div>`;
  } else if (ui >= U.length) {
    $('meta').textContent = ''; $('stem').innerHTML = '<h1>סוף המבדק</h1><h2>תודה.</h2>'; $('next').style.display = 'none'; return;
  } else {
    const q = u.qs[qi];
    $('meta').textContent = `פרק ${ui + 1}: ${u.name} · שאלה ${qi + 1} מתוך ${u.qs.length}`;
    $('stem').innerHTML = q.stem;
    $('opts').style.gridTemplateColumns = u.sr ? `repeat(${q.opts.length}, 1fr)` : '1fr 1fr';
    if (q.fmt === 'typed') { $('opts').style.gridTemplateColumns = '1fr'; $('opts').innerHTML = '<label><span class=lbl>תשובה:</span><input id=typed type=text inputmode=numeric style="font-size:20px;padding:6px;width:220px"></label>'; return; }
    if (q.fmt === 'order') { $('opts').innerHTML = q.opts.map((o, i) => `<label><span class=lbl>${HE[i]}.</span><span style="flex:1">${o}</span><input type=number min=1 max=${q.opts.length} placeholder="#" style="width:56px;font-size:18px"></label>`).join(''); return; }
    if (q.fmt === 'multi') { $('opts').innerHTML = q.opts.map((o, i) => `<label><input type=checkbox name=m><span class=lbl>${HE[i]}.</span><span>${o}</span></label>`).join(''); return; }
    $('opts').innerHTML = q.opts.map((o, i) => u.sr ? `<label style="justify-content:center;text-align:center"><input type=radio name=a><span>${o}</span></label>`
                                                   : `<label><input type=radio name=a><span class=lbl>${HE[i]}.</span><span>${o}</span></label>`).join('');
  }
}
function next() {
  if (qi === -2) qi = -1;
  else if (qi === -1) qi = 0;
  else if (qi + 1 < U[ui].qs.length) qi++;
  else { ui++; qi = ui < U.length ? -1 : 0; }
  render();
}
$('next').onclick = next;
// choosing an answer moves on to the next question
document.addEventListener('change', e => { if (e.target.name === 'a') setTimeout(next, 400); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'Enter') next(); });
const t0 = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
if (autoSec) { $('auto').textContent = `מעבר אוטומטי כל ${autoSec} שניות`; setInterval(() => { if (ui < U.length) next(); }, autoSec * 1000); }
if (p.get('unit')) qi = p.has('q') ? +p.get('q') : -1;   // ?unit=3&q=-1 instructions, q=0.. a question (CI screenshots)
render();
</script>
