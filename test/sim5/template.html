<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>סימולטור תרגול</title>
<style>
:root{--blue:#1f4e8c;--bg:#eef2f7;--line:#c9d3e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:19px Arial,Helvetica,sans-serif;color:#111}
header{background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;font-size:17px}
#timer{font:bold 22px monospace;background:#fff;color:var(--blue);padding:4px 12px;border-radius:4px}
main{max-width:860px;margin:28px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px 36px;min-height:360px}
#meta{color:#556;font-size:15px;margin-bottom:12px}
#stem{line-height:1.7;margin-bottom:18px}
#stem svg{display:block;margin:14px auto}
.big{font-size:26px}.cap{text-align:center;font-size:15px;color:#333;margin-top:10px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#opts label{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;min-height:56px}
#opts .lbl{font-weight:bold;min-width:22px}
h1{font-size:30px;margin:0 0 6px}h2{font-size:20px;color:#556;font-weight:normal;margin:0 0 22px}
.instr{font-size:21px;line-height:1.8}
footer{max-width:860px;margin:0 auto;display:flex;justify-content:flex-start;gap:12px;align-items:center}
button{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 34px;font-size:18px;cursor:pointer}
#auto{font-size:14px;color:#556}
</style></head>
<body>
<header><span>סימולטור תרגול · מבדק חשיבה</span><span id="timer">00:00</span></header>
<main><div id="meta"></div><div id="stem"></div><div id="opts"></div></main>
<footer><button id="next">הבא ›</button><span id="auto"></span></footer>
<script>
// 5 units x 50 questions. Correct answers are NOT in this page (server key.json only).
const U = /*DATA*/;
const HE = ['א','ב','ג','ד'];
const p = new URLSearchParams(location.search);
let ui = Math.max(0, (+p.get('unit') || 1) - 1), qi = -2;   // -2 = start screen, -1 = unit instructions
const autoSec = +p.get('auto') || 0;
const $ = id => document.getElementById(id);
function render() {
  const u = U[ui];
  $('opts').innerHTML = '';
  if (qi === -2) {
    $('meta').textContent = '';
    $('stem').innerHTML = `<h1>ברוכים הבאים</h1><h2>המבדק כולל ${U.length} פרקים, ${U[0].qs.length} שאלות בכל פרק.</h2><div class=instr>לחצו "הבא" כדי להתחיל.</div>`;
  } else if (qi === -1) {
    $('meta').textContent = `פרק ${ui + 1} מתוך ${U.length}`;
    $('stem').innerHTML = `<h1>פרק ${ui + 1}: ${u.name}</h1><h2>הנחיות לפרק</h2><div class=instr>${u.instr}</div><div class=instr style="margin-top:18px;color:#556">בפרק ${u.qs.length} שאלות. לחצו "הבא" כדי להתחיל את הפרק.</div>`;
  } else if (ui >= U.length) {
    $('meta').textContent = ''; $('stem').innerHTML = '<h1>סוף המבדק</h1><h2>תודה.</h2>'; $('next').style.display = 'none'; return;
  } else {
    const q = u.qs[qi];
    $('meta').textContent = `פרק ${ui + 1}: ${u.name} · שאלה ${qi + 1} מתוך ${u.qs.length}`;
    $('stem').innerHTML = q.stem;
    $('opts').innerHTML = q.opts.map((o, i) => `<label><input type=radio name=a><span class=lbl>${HE[i]}.</span><span>${o}</span></label>`).join('');
  }
}
function next() {
  if (qi === -2) qi = -1;
  else if (qi === -1) qi = 0;
  else if (qi + 1 < U[ui].qs.length) qi++;
  else { ui++; qi = ui < U.length ? -1 : 0; }
  render();
}
$('next').onclick = next;
// choosing an answer moves on to the next question
document.addEventListener('change', e => { if (e.target.name === 'a') setTimeout(next, 400); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'Enter') next(); });
const t0 = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
if (autoSec) { $('auto').textContent = `מעבר אוטומטי כל ${autoSec} שניות`; setInterval(() => { if (ui < U.length) next(); }, autoSec * 1000); }
if (p.get('unit')) qi = -1;
render();
</script>
</body></html>
